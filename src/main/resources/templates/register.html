<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title> User Register</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      background: linear-gradient(135deg, #0d0d0d, #1a1a1a, #000000);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Floating squares animation */
    .squares {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      overflow: hidden;
      z-index: 0;
    }
    .squares div {
      position: absolute;
      display: block;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.05);
      animation: float 25s linear infinite;
      bottom: -150px;
    }
    .squares div:nth-child(1) { left: 25%; width: 60px; height: 60px; animation-delay: 0s; }
    .squares div:nth-child(2) { left: 10%; animation-delay: 2s; animation-duration: 12s; }
    .squares div:nth-child(3) { left: 70%; width: 80px; height: 80px; animation-delay: 4s; }
    .squares div:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
    .squares div:nth-child(5) { left: 65%; animation-delay: 0s; }
    .squares div:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
    .squares div:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
    .squares div:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
    .squares div:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
    .squares div:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }

    @keyframes float {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
    }

    /* Register box */
    .register-box {
      position: relative;
      z-index: 1;
      width: 350px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      text-align: center;
      color: #fff;
    }

    .register-box h2 {
      margin-bottom: 20px;
      color: #fff;
      font-size: 24px;
    }

    .register-box input,
    .register-box select {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      outline: none;
      border-radius: 6px;
      font-size: 14px;
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    .register-box input::placeholder {
      color: #bbb;
    }

    .register-box button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      background: #000;
      color: #fff;
      transition: 0.3s;
    }

    .register-box button:hover {
      background: #222;
    }

    .login-link {
      margin-top: 15px;
      font-size: 14px;
    }

    .login-link a {
      color: #fff;
      font-weight: bold;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="squares">
  <div></div><div></div><div></div><div></div><div></div>
  <div></div><div></div><div></div><div></div><div></div>
</div>

<div class="register-box">
  <h2>Register</h2>
  <form action="saveUser" method="post">
    <input type="text" placeholder="Full Name" required name="name">
    <input type="email" placeholder="Email Address" required name="email">
    <select required name="gender">
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>
    <input type="password" placeholder="Password" required name="password">
    <button type="submit">Register</button>
  </form>
  <div class="login-link">
    Already have an account? <a href="/login">Login</a>
  </div>
</div>

</body>
</html>
