<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #000000, #1a1a1a);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
      font-family: Arial, sans-serif;
    }

    .background-cubes {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -1;
    }

    .cube {
      position: absolute;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: float 20s infinite linear;
      transform: rotateX(45deg) rotateY(45deg);
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); }
      100% { transform: translateY(-10vh) rotate(360deg); }
    }
  </style>
</head>
<body>

  
  <div class="background-cubes">
    <div class="cube" style="left: 10%; animation-delay: 0s;"></div>
    <div class="cube" style="left: 30%; animation-delay: 3s;"></div>
    <div class="cube" style="left: 50%; animation-delay: 6s;"></div>
    <div class="cube" style="left: 70%; animation-delay: 9s;"></div>
    <div class="cube" style="left: 90%; animation-delay: 12s;"></div>
  </div>


  <div class="bg-white/10 backdrop-blur-lg shadow-xl rounded-2xl p-10 w-96 border border-white/20">
    <h2 class="text-3xl font-bold text-white text-center mb-6">Login</h2>

    <th:block th:if="${session.msg}">
      <p class="text-red-400 text-center mb-4">[[${session.msg}]]</p>
    </th:block>

    <form method="post" action="userlogin" class="space-y-4">
      <input type="email" id="email" name="email" placeholder="Enter Email" required
             class="w-full p-3 rounded-lg bg-white/20 text-white placeholder-gray-300 focus:outline-none">
      <input type="password" id="password" name="password" placeholder="Enter Password" required
             class="w-full p-3 rounded-lg bg-white/20 text-white placeholder-gray-300 focus:outline-none">
      <button type="submit" 
              class="w-full p-3 bg-black text-white rounded-lg hover:bg-gray-800 transition">Login</button>
    </form>

    <p class="text-center text-gray-300 mt-6">
      Don’t have an account? <a href="/register" class="text-white font-semibold hover:underline">Sign Up</a>
    </p>
  </div>

</body>
</html>
