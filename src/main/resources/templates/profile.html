<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SufferNow</title>
  <style>
    body {
      margin: 0;

    header {

      align-items: center;
      padding: 15px 50px;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
      color: #e63946;
    }
    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #212529;
      font-weight: 500;
    }
    nav a:hover {
      color: #e63946;
    }
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 60px 80px;
      background: linear-gradient(135deg, #fff8e1, #ffffff);
    }
    .hero-text h2 {
      font-size: 42px;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .hero-text p {
      font-size: 18px;
      margin-bottom: 25px;
    }
    .btn {
      padding: 12px 25px;
      margin-right: 12px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: #ffcc00;
      color: #212529;
    }
    .btn-primary:hover {
      background: #e6b800;
    }
    .btn-outline {
      border: 2px solid #212529;
      background: white;
      color: #212529;
    }
    .btn-outline:hover {
      background: #212529;
      color: white;
    }
    .booking-section {
      text-align: center;
      padding: 60px 20px;
      background: #fff;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
    }
    .booking-section h3 {
      font-size: 28px;
      margin-bottom: 30px;
    }
    .booking-inputs input {
      padding: 12px 18px;
      margin: 10px;
      width: 220px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
    }
    .booking-inputs button {
      padding: 12px 25px;
      border-radius: 8px;
      border: none;
      background: #ffcc00;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .booking-inputs button:hover {
      background: #e6b800;
    }
    footer {
      background: #212529;
      color: white;
      display: flex;
      justify-content: space-between;
      padding: 20px 50px;
      font-size: 14px;
      margin-top: 40px;
    }
    footer a {
      color: #ffcc00;
      text-decoration: none;
      margin-left: 15px;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <header>
    <h1>SufferNow</h1>
    <nav>
      <a href="/register">Ride</a>
      <a href="/login">Drive</a>
      <a href="/Help">Help</a>
      <a href="/login">Login</a>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h2>Move the way you want</h2>
      <p>Book rides in seconds. Affordable, reliable, and available 24/7 — anywhere, anytime.</p>
      <button class="btn btn-primary" onclick="window.location.href='/ride'">Book A Ride</button>
      <button class="btn btn-outline" onclick="window.location.href='/Self'">Self Driver</button>
    </div>
  </section>

  <section class="booking-section">
    <h3>Book your ride now</h3>
    <div class="booking-inputs">
      <input type="text" placeholder="Pickup Location">
      <input type="text" placeholder="Drop Location">
      <button>Find Ride</button>
    </div>
  </section>

  <footer>
    <div>© 2025 SufferNow. All Rights Reserved.</div>
    <div>
      <a href="/Privacy">Privacy</a>
      <a href="/Terms">Terms</a>
      <a href="/About">About</a>
    </div>
  </footer>
</body>
</html>
