	  <style>
	    * {margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', sans-serif;}
	    body {
	      background: #000;
	      color: white;
	      overflow: hidden;
	    }

	    /* ✅ Navbar */
	    nav {
	      position: fixed;
	      top: 0; left: 0; width: 100%;
	      background: rgba(0,0,0,0.7);
	      color: white;
	      display: flex;
	      justify-content: space-between;
	      align-items: center;
	      padding: 15px 50px;
	      z-index: 1000;
	    }
	    nav h1 {font-size: 22px;}
	    nav ul {display: flex; list-style:none;}
	    nav ul li {margin-left: 25px;}
	    nav ul li a {color: white; text-decoration: none; font-weight: 500;}
	    nav ul li a:hover {color: #ffcc00;}

	    /* ✅ Hero Section with Background */
	    .hero {
	      height: 100vh;
	      width: 100%;
	      background: url('https://images.unsplash.com/photo-1505761671935-60b3a7427bad') center/cover no-repeat; /* ✅ City background */
	      display: flex;
	      align-items: center;
	      justify-content: center;
	      text-align: center;
	      position: relative;
	      overflow: hidden;
	    }
	    .hero::after {
	      content: "";
	      position: absolute;
	      top:0; left:0; width:100%; height:100%;
	      background: rgba(0,0,0,0.6);
	    }
	    .hero-content {
	      position: relative;
	      z-index: 1;
	      animation: fadeIn 2s ease-in-out;
	    }
	    .hero h2 {
	      font-size: 50px;
	      margin-bottom: 20px;
	      font-weight: bold;
	    }
	    .hero p {font-size: 20px; margin-bottom: 20px;}

	    /* ✅ Buttons */
	    .btn {
	      padding: 12px 25px;
	      background: #ffcc00;
	      color: black;
	      font-weight: bold;
	      border-radius: 8px;
	      text-decoration: none;
	      transition: 0.3s;
	      margin: 10px;
	      display: inline-block;
	    }
	    .btn:hover {
	      background: #ffb300;
	      transform: scale(1.05);
	    }

	    /* ✅ Floating 3D Cubes Animation */
	    .cube {
	      position: absolute;
	      width: 40px; height: 40px;
	      background: rgba(255,255,255,0.1);
	      border: 1px solid rgba(255,255,255,0.2);
	      animation: float 15s infinite linear;
	      transform: rotateX(45deg) rotateY(45deg);
	    }
	    .cube:nth-child(1){left:10%; animation-delay:0s;}
	    .cube:nth-child(2){left:30%; animation-delay:4s;}
	    .cube:nth-child(3){left:50%; animation-delay:8s;}
	    .cube:nth-child(4){left:70%; animation-delay:12s;}
	    .cube:nth-child(5){left:90%; animation-delay:16s;}

	    @keyframes float {
	      0% {transform: translateY(100vh) rotate(0deg);}
	      100% {transform: translateY(-10vh) rotate(360deg);}
	    }

	    @keyframes fadeIn {
	      from {opacity: 0; transform: translateY(30px);}
	      to {opacity: 1; transform: translateY(0);}
	    }
	  </style>
	</head>
	<body>

<!-- Login Modal -->
<div class="modal" id="login-modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('login')">&times;</span>
        <h3>Login</h3>
        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Enter password">
        </div>
        <button>Login</button>
    </div>
</div>

<!-- Register Modal -->
<div class="modal" id="register-modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal('register')">&times;</span>
        <h3>Register</h3>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" placeholder="Enter full name">
        </div>
        <div class="form-group">
            <label>Mobile Number</label>
            <input type="tel" placeholder="Enter mobile number" pattern="[0-9]{10}">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Enter email">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" placeholder="Create password">
        </div>
        <button>Register</button>
    </div>
</div>
