<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ride Animation</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(to top, #87ceeb, #ffffff);
      overflow: hidden;
    }

    h1 {
      margin-top: 20px;
      font-size: 28px;
      color: #333;
    }

    #time {
      font-size: 20px;
      color: #444;
      margin-bottom: 10px;
    }

    #eta {
      font-size: 22px;
      color: darkred;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .road {
      position: relative;
      width: 100%;
      height: 200px;
      background: #333;
      margin-top: 50px;
      overflow: hidden;
    }

    .road::before {
      content: "";
      position: absolute;
      top: 90px;
      left: 0;
      width: 100%;
      height: 20px;
      background: repeating-linear-gradient(
        to right,
        #fff,
        #fff 40px,
        transparent 40px,
        transparent 80px
      );
      animation: moveRoad 2s linear infinite;
    }

    @keyframes moveRoad {
      from { transform: translateX(0); }
      to { transform: translateX(-80px); }
    }

	.car {
	  position: absolute;
	  bottom: 20px;
	  left: -150px;
	  width: 120px;
	  height: 60px;
	  background: url("/image/car.png") no-repeat center/cover;
	  animation: drive 6s linear infinite;
	}

	@keyframes drive {
	  0% {
	    left: -150px;
	  }
	  100% {
	    left: 100%;
	  }
	}


  </style>
</head>
<body>
  <h1>🚖 Your Ride is on the Way!</h1>
  <div id="time"></div>
  <div id="eta"></div>

  <div class="road">
    <div class="car"></div>
  </div>

  <script>
    // Show Live Time
    function updateTime() {
      const now = new Date();
      document.getElementById("time").innerText =
        "⏰ Current Time: " + now.toLocaleTimeString();
    }
    setInterval(updateTime, 1000);
    updateTime();

    // Show ETA (10 minutes message)
    function showETA() {
      document.getElementById("eta").innerText =
        "🕒 Your Cab will arrive in 10 minutes. Please be ready!";
    }
    showETA();
  </script>
</body>
</html>
